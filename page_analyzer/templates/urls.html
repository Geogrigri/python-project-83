{% extends "layout.html" %}

{% block content %}
<h1>Сайты</h1>

<table class="table table-bordered table-hover" data-test="urls">
  <thead>
    <tr>
      <th>ID</th>
      <th>Имя</th>
      <th>Последняя проверка</th>
      <th>Код ответа</th>
    </tr>
  </thead>
  <tbody>
    {% for url in urls %}
      <tr>
        <td>{{ url.id }}</td>
        <td>
          <a href="{{ url_for('url_get', id=url.id) }}">
            {{ url.name }}
          </a>
        </td>
        <td>{{ url.last_check_created_at or '' }}</td>
        <td>{{ url.last_check_status_code or '' }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
