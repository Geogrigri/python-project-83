{% extends "layout.html" %}

{% block content %}
<section class="bg-light border rounded-3 p-5">
  <h1 class="display-3">Анализатор страниц</h1>
  <p class="lead">
    Бесплатно проверяйте сайты на SEO-пригодность
  </p>

  <form action="{{ url_for('urls_post') }}" method="post" class="d-flex">
    <input
      type="text"
      name="url"
      value="{{ url or '' }}"
      class="form-control form-control-lg"
      placeholder="https://www.example.com"
      required
    >
    <input
      type="submit"
      class="btn btn-primary btn-lg ms-3 px-5 text-uppercase"
      value="Проверить"
    >
  </form>
</section>
{% endblock %}
